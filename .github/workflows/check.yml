name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install
        run: npm install --global pnpm@12 && pnpm install --frozen-lockfile
      - name: Format, lint and type-check
        run: pnpm check
